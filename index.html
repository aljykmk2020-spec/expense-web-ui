<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳管理後台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e5e5e0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.logo-icon{width:26px;height:26px;border-radius:7px;background:#e6f1fb;display:flex;align-items:center;justify-content:center}
.btn{border:1px solid #ddd;background:#fff;color:#333;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#e6f1fb;border-color:#b5d4f4;color:#185fa5}
.btn-primary:hover{background:#d0e8f8}
.btn-danger{background:#fcebeb;border-color:#f7c1c1;color:#a32d2d}
.main{padding:20px;max-width:1000px;margin:0 auto}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:#ebebeb;border-radius:8px;padding:12px 14px}
.stat-label{font-size:12px;color:#666;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:500}
.stat-sub{font-size:11px;color:#999;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{background:#fff;border:1px solid #e5e5e0;border-radius:12px;overflow:hidden;margin-bottom:20px}
.panel-header{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e5e0}
.panel-title{font-size:14px;font-weight:500}
.filter-row{padding:10px 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e5e0;flex-wrap:wrap}
.filter-row select,.filter-row input{border:1px solid #ddd;background:#f9f9f9;color:#333;border-radius:8px;padding:5px 9px;font-size:13px;outline:none}
.fl{font-size:12px;color:#999}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;color:#666;font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid #e5e5e0;white-space:nowrap}
td{font-size:13px;padding:10px 14px;border-bottom:1px solid #f0f0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.col-date{width:88px}.col-cat{width:72px}.col-merchant{width:auto}.col-item{width:100px}.col-card{width:130px}.col-amt{width:80px;text-align:right}.col-act{width:64px;text-align:right}
.amount{font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:20px}
.b-餐飲{background:#e1f5ee;color:#0f6e56}.b-交通{background:#e6f1fb;color:#185fa5}.b-購物{background:#faeeda;color:#854f0b}.b-訂閱{background:#eeedfe;color:#534ab7}.b-健康{background:#fcebeb;color:#a32d2d}.b-貸款{background:#faeeda;color:#993c1d}.b-投資{background:#eaf3de;color:#3b6d11}.b-其他{background:#f1efe8;color:#5f5e5a}
.row-actions{display:flex;justify-content:flex-end;gap:3px;opacity:0}
tr:hover .row-actions{opacity:1}
.icon-btn{border:1px solid #e5e5e0;background:none;color:#666;border-radius:6px;width:26px;height:26px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.icon-btn:hover{background:#f5f5f5;color:#333}
.icon-btn.danger:hover{background:#fcebeb;color:#a32d2d}
.pagination{padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e5e5e0}
.page-info{font-size:12px;color:#666}
.page-btns{display:flex;gap:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding-top:60px;z-index:200}
.modal-bg.open{display:flex}
.modal{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:20px;width:440px;max-width:calc(100vw - 32px)}
.modal-title{font-size:14px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.form-group{margin-bottom:12px}
.form-label{font-size:12px;color:#666;display:block;margin-bottom:4px}
.form-input{width:100%;border:1px solid #ddd;background:#f9f9f9;color:#333;border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
.confirm-dialog{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:20px;width:340px}
.toast{position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 4px 12px rgba(0,0,0,.1);opacity:0;transform:translateY(6px);transition:all .22s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:translateY(0)}
.login-wrap{max-width:360px;margin:80px auto;padding:0 20px}
.login-card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:24px}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;background:#1d9e75}
.dot-err{background:#e24b4a}
@media(max-width:600px){.stat-row{grid-template-columns:1fr 1fr}.col-card,.col-item{display:none}.main{padding:12px}}
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <p style="font-size:15px;font-weight:500;margin-bottom:6px"><i class="ti ti-wallet"></i> 記帳管理後台</p>
      <p style="font-size:13px;color:#666;margin-bottom:18px">請輸入連線設定</p>
      <div class="form-group">
        <label class="form-label">Render 服務網址</label>
        <input class="form-input" id="login-url" placeholder="https://line-expense-bot-docker.onrender.com" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">API Token（WEB_API_TOKEN）</label>
        <input class="form-input" id="login-token" placeholder="貼入你的 token" type="password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="doLogin()">
        <i class="ti ti-login"></i> 登入
      </button>
      <p id="login-err" style="font-size:12px;color:#a32d2d;margin-top:10px;display:none"></p>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon"><i class="ti ti-wallet" style="font-size:14px;color:#185fa5"></i></div>
      記帳管理後台
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:#999" id="conn-status"><span class="status-dot"></span>已連線</span>
      <button class="btn" onclick="loadData()"><i class="ti ti-refresh"></i></button>
      <button class="btn btn-primary" onclick="openAddModal()"><i class="ti ti-plus"></i> 新增</button>
      <button class="btn" onclick="doLogout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>

  <div class="main">
    <div class="stat-row">
      <div class="stat-card" style="border-left:3px solid #1d9e75;cursor:pointer" onclick="filterByBilling('paid')" title="點擊查看明細">
        <div class="stat-label" style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#1d9e75;display:inline-block"></span>本月已付／應付 <span style="font-size:10px;color:#999">▼點擊篩選</span></div>
        <div class="stat-value" id="s-paid">—</div>
        <div class="stat-sub" id="s-paid-sub">settlement_month ≤ 本月</div>
      </div>
      <div class="stat-card" style="border-left:3px solid #ba7517;cursor:pointer" onclick="filterByBilling('next')" title="點擊查看明細">
        <div class="stat-label" style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:#ba7517;display:inline-block"></span>次月預計 <span style="font-size:10px;color:#999">▼點擊篩選</span></div>
        <div class="stat-value" id="s-next">—</div>
        <div class="stat-sub" id="s-next-sub">settlement_month = 下個月</div>
      </div>
      <div class="stat-card"><div class="stat-label">本月消費筆數</div><div class="stat-value" id="s-count">—</div><div class="stat-sub" id="s-month">本月記錄</div></div>
      <div class="stat-card"><div class="stat-label">最高單筆</div><div class="stat-value" id="s-max">—</div><div class="stat-sub" id="s-max-desc">—</div></div>
    </div>

    <!-- Dashboard 圖表 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px" id="dashboard-row">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">近6個月支出趨勢</span></div>
        <div style="padding:16px"><canvas id="chart-trend" height="180"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">本月分類比例</span></div>
        <div style="padding:16px;display:flex;align-items:center;gap:16px">
          <canvas id="chart-pie" width="160" height="160" style="flex-shrink:0"></canvas>
          <div id="pie-legend" style="font-size:12px;line-height:1.8;color:#444"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">支出記錄</span>
        <span style="font-size:12px;color:#999"><i class="ti ti-table"></i> Google Sheets</span>
      </div>
      <div class="filter-row">
        <span class="fl">月份</span><select id="f-month" onchange="applyFilters()"></select>
        <span class="fl">分類</span>
        <select id="f-cat" onchange="applyFilters()">
          <option value="">全部</option>
          <option>餐飲</option><option>交通</option><option>購物</option>
          <option>訂閱</option><option>健康</option><option>貸款</option>
          <option>投資</option><option>其他</option>
        </select>
        <span class="fl">付款</span>
        <select id="f-pay" onchange="applyFilters()">
          <option value="">全部</option>
          <option value="cash">現金</option>
          <option value="credit_card">信用卡</option>
          <option value="scheduled">定期</option>
        </select>
        <input type="text" id="f-search" placeholder="搜尋商家或品項..." style="flex:1;min-width:110px" oninput="applyFilters()">
      </div>
      <table>
        <thead>
          <tr>
            <th class="col-date">日期</th>
            <th class="col-cat">分類</th>
            <th class="col-merchant">商家</th>
            <th class="col-item">品項</th>
            <th class="col-card">卡片</th>
            <th class="col-amt">金額</th>
            <th class="col-act"></th>
          </tr>
        </thead>
        <tbody id="expense-tbody">
          <tr><td colspan="7" style="text-align:center;padding:32px;color:#999">載入中...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <span class="page-info" id="page-info">—</span>
        <div class="page-btns">
          <button class="btn" id="btn-prev" onclick="changePage(-1)"><i class="ti ti-chevron-left"></i></button>
          <button class="btn" id="btn-next" onclick="changePage(1)"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
    </div>
    <p style="font-size:11px;color:#999;text-align:center;padding-bottom:20px">資料來源：Google Sheets｜刪除為軟刪除，資料仍保留於 Sheets</p>
  </div>
</div>

<div class="modal-bg" id="edit-modal" onclick="closeBg(event,'edit-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span id="modal-label">編輯記帳</span>
      <button class="icon-btn" onclick="closeModal('edit-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">日期</label><input class="form-input" type="date" id="e-date"></div>
      <div class="form-group"><label class="form-label">金額（NT$）</label><input class="form-input" type="number" id="e-amount"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">商家</label><input class="form-input" type="text" id="e-merchant" placeholder="Uber Eats、全家..."></div>
      <div class="form-group"><label class="form-label">品項</label><input class="form-input" type="text" id="e-item" placeholder="午餐、飲料..."></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">分類</label>
        <select class="form-input" id="e-cat">
          <option>早餐</option><option>午餐</option><option>晚餐</option>
          <option>飲料</option><option>小費</option><option>餐飲</option>
          <option>購物</option><option>交通</option><option>生活</option>
          <option>訂閱</option><option>健康</option><option>預定</option>
          <option>貸款</option><option>投資</option><option>保險</option>
          <option value="Google play">Google play</option><option>其他</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">付款方式</label>
        <select class="form-input" id="e-pay">
          <option value="cash">現金</option>
          <option value="credit_card">信用卡</option>
          <option value="debit_card">金融卡</option>
          <option value="bank_transfer">銀行轉帳</option>
          <option value="scheduled">定期</option>
          <option value="investment">投資</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">卡片名稱</label><input class="form-input" type="text" id="e-card" placeholder="國泰CUBE、Pi錢包卡..."></div>
      <div class="form-group"><label class="form-label">供應商／平台</label><input class="form-input" type="text" id="e-vendor" placeholder="選填"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">消費月份</label><input class="form-input" type="month" id="e-spending-month"></div>
      <div class="form-group"><label class="form-label">帳單月份</label><input class="form-input" type="month" id="e-billing-month"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">結算月份</label><input class="form-input" type="month" id="e-settlement-month"></div>
      <div class="form-group"><label class="form-label">狀態</label>
        <select class="form-input" id="e-status">
          <option value="">（預設）</option>
          <option value="pending">pending</option>
          <option value="confirmed">confirmed</option>
          <option value="settled">settled</option>
          <option value="scheduled">scheduled</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">備註</label><input class="form-input" type="text" id="e-note" placeholder="選填"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('edit-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()"><i class="ti ti-device-floppy"></i> 儲存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirm-modal" onclick="closeBg(event,'confirm-modal')">
  <div class="confirm-dialog" onclick="event.stopPropagation()">
    <p style="font-size:14px;font-weight:500;margin-bottom:8px">確認刪除</p>
    <p style="font-size:13px;color:#666;margin-bottom:18px" id="confirm-msg">確定要刪除這筆記帳嗎？</p>
    <div style="display:flex;justify-content:flex-end;gap:6px">
      <button class="btn" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-danger" id="confirm-ok"><i class="ti ti-trash"></i> 刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti" id="toast-icon"></i><span id="toast-msg">完成</span></div>

<script>
let API_BASE='',TOKEN='',allRecords=[],filtered=[],currentPage=1,editingId=null;
const PER_PAGE=20;

function init(){
  const s=localStorage.getItem('expense_config');
  if(s){try{const c=JSON.parse(s);API_BASE=c.url||'';TOKEN=c.token||'';if(API_BASE&&TOKEN){showApp();return;}}catch(e){}}
  showLogin();
}
function showLogin(){document.getElementById('login-screen').style.display='block';document.getElementById('app-screen').style.display='none';}
function showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app-screen').style.display='block';buildMonthOptions();loadData();}

async function doLogin(){
  const url=document.getElementById('login-url').value.trim().replace(/\/$/,'');
  const token=document.getElementById('login-token').value.trim();
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!url||!token){err.textContent='請填寫網址與 Token。';err.style.display='block';return;}
  try{
    const r=await fetch(`${url}/api/expenses?per_page=1`,{headers:{'Authorization':`Bearer ${token}`}});
    if(r.status===401){err.textContent='Token 錯誤。';err.style.display='block';return;}
    if(!r.ok){err.textContent=`伺服器回應 ${r.status}。`;err.style.display='block';return;}
    API_BASE=url;TOKEN=token;
    localStorage.setItem('expense_config',JSON.stringify({url,token}));
    showApp();
  }catch(e){err.textContent='無法連線：'+e.message;err.style.display='block';}
}
function doLogout(){localStorage.removeItem('expense_config');API_BASE='';TOKEN='';allRecords=[];filtered=[];showLogin();}
function h(){return{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'};}

function syncCategoryOptions(records){
  const sel=document.getElementById('e-cat');
  const existing=new Set([...sel.options].map(o=>o.value||o.text));
  records.forEach(r=>{
    const cat=r.category;
    if(cat&&!existing.has(cat)){
      const opt=document.createElement('option');
      opt.value=cat;opt.textContent=cat;
      sel.insertBefore(opt,sel.lastElementChild);
      existing.add(cat);
    }
  });
}

function buildMonthOptions(){
  const sel=document.getElementById('f-month');sel.innerHTML='';
  const now=new Date();
  const cur=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  // 未來6個月到過去12個月，共18個月
  for(let i=-6;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');
    const val=`${y}-${m}`;
    const opt=document.createElement('option');
    opt.value=val;
    const label=`${y}年${d.getMonth()+1}月`+(i<0?' (未來)':'');
    opt.textContent=label;
    if(val===cur)opt.selected=true;
    sel.appendChild(opt);
  }
}

async function loadData(){
  document.getElementById('expense-tbody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:28px;color:#999">載入中...</td></tr>';
  try{
    const r=await fetch(`${API_BASE}/api/expenses?per_page=500`,{headers:h()});
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    allRecords=data.records||[];
    syncCategoryOptions(allRecords);
    document.getElementById('conn-status').innerHTML='<span class="status-dot"></span>已連線';
    applyFilters();
  }catch(e){
    document.getElementById('conn-status').innerHTML='<span class="status-dot dot-err"></span>連線失敗';
    document.getElementById('expense-tbody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:28px;color:#a32d2d">無法連線，請點重新整理</td></tr>';
  }
}

function parseMonthKey(r){
  if(r.spending_month&&r.spending_month.match(/^\d{4}-\d{2}$/))return r.spending_month;
  const d=r.date||'';
  if(d.match(/^\d{4}-\d{2}/))return d.slice(0,7);
  if(d.match(/^\d{4}\/\d{2}/))return d.slice(0,7).replace('/','-');
  return '';
}

function applyFilters(){
  const month=document.getElementById('f-month').value;
  const cat=document.getElementById('f-cat').value;
  const pay=document.getElementById('f-pay').value;
  const q=document.getElementById('f-search').value.toLowerCase();
  filtered=allRecords.filter(r=>{
    if(month&&parseMonthKey(r)!==month)return false;
    if(cat&&r.category!==cat)return false;
    if(pay&&r.payment_type!==pay)return false;
    if(q&&!r.merchant?.toLowerCase().includes(q)&&!r.item?.toLowerCase().includes(q))return false;
    return true;
  });
  currentPage=1;renderTable();updateStats();drawDashboard();
}

function renderTable(){
  const tbody=document.getElementById('expense-tbody');
  const start=(currentPage-1)*PER_PAGE;
  const page=filtered.slice(start,start+PER_PAGE);
  if(!page.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:36px;color:#999">沒有符合條件的記錄</td></tr>';document.getElementById('page-info').textContent='共 0 筆';return;}
  tbody.innerHTML=page.map(r=>{
    const bc='b-'+(r.category||'其他');
    const cardOrPay=r.card_name||(r.payment_type==='cash'?'現金':r.payment_type==='scheduled'?'定期':'刷卡');
    // 計算 billing 標記
    const month=document.getElementById('f-month').value;
    const nmo=nextMonth(month);
    const bm=r.billing_month||'';
    let billingBadge='';
    if(bm===nmo){
      billingBadge=`<span style="margin-left:4px;font-size:10px;padding:1px 5px;border-radius:10px;background:#faeeda;color:#854f0b">次月付</span>`;
    } else if(bm && bm>nmo){
      billingBadge=`<span style="margin-left:4px;font-size:10px;padding:1px 5px;border-radius:10px;background:#eeedfe;color:#534ab7">遠期</span>`;
    }
    return`<tr>
      <td class="col-date" style="color:#666">${r.date?.slice(5)||''}</td>
      <td class="col-cat"><span class="badge ${bc}">${esc(r.category||'')}</span></td>
      <td class="col-merchant">${esc(r.merchant||r.item||'—')}</td>
      <td class="col-item" style="color:#666">${esc(r.item||'—')}</td>
      <td class="col-card" style="color:#666;font-size:12px">${esc(cardOrPay)}${billingBadge}</td>
      <td class="col-amt"><span class="amount">$${Math.round(r.amount||0).toLocaleString()}</span></td>
      <td class="col-act"><div class="row-actions">
        <button class="icon-btn" onclick="openEdit('${r.record_id}')" title="編輯"><i class="ti ti-edit"></i></button>
        <button class="icon-btn danger" onclick="confirmDel('${r.record_id}')" title="刪除"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('');
  const total=filtered.length,pages=Math.ceil(total/PER_PAGE);
  document.getElementById('page-info').textContent=`第 ${start+1}–${Math.min(start+PER_PAGE,total)} 筆，共 ${total} 筆`;
  document.getElementById('btn-prev').disabled=currentPage<=1;
  document.getElementById('btn-next').disabled=currentPage>=pages;
}

function nextMonth(ym){
  // 傳入 "2026-05"，回傳 "2026-06"
  const [y,m]=ym.split('-').map(Number);
  const nd=new Date(y,m,1); // m 已是 1-based，Date month 是 0-based，所以 m=next
  return `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
}


function filterByBilling(type){
  const month=document.getElementById('f-month').value;
  const nmo=nextMonth(month);
  let subset;
  const SCHED=['scheduled','investment'];
  if(type==='paid'){
    subset=allRecords.filter(r=>{
      if(parseMonthKey(r)!==month)return false;
      const sm=r.settlement_month||'';
      const bm=r.billing_month||'';
      const pt=r.payment_type||'cash';
      if(SCHED.includes(pt))return false;
      if(pt==='credit_card'){const ref=sm||bm;return ref&&ref<=month;}
      return !sm||sm<=month;
    });
  } else {
    subset=allRecords.filter(r=>{
      if(parseMonthKey(r)!==month)return false;
      return (r.billing_month||'')===nmo;
    });
  }
  // 顯示明細：暫時覆蓋 filtered 讓 renderTable 用
  filtered=subset;
  currentPage=1;
  renderTable();
  // 提示
  const label=type==='paid'?'本月已付／應付':'次月預計';
  showToast(`顯示${label}的 ${subset.length} 筆明細，點重新整理回全部`);
}

function updateStats(){
  const month=document.getElementById('f-month').value;
  const nextMo=nextMonth(month);
  const nmo=nextMo;
  const [y,mo]=month.split('-');

  // 本月消費記錄（以 spending_month / date 判斷，不管帳單月份）
  const mr=allRecords.filter(r=>parseMonthKey(r)===month);

  // 本月已付／應付：用 settlement_month 判斷實際繳款月份
  // - credit_card：settlement_month <= 本月（後端已正確計算）
  // - cash/其他：settlement_month 空白或 <= 本月
  // - scheduled/investment：一律排除
  const SCHEDULED_TYPES=['scheduled','investment'];
  const paidRecords=mr.filter(r=>{
    const sm=r.settlement_month||'';
    const bm=r.billing_month||'';
    const pt=r.payment_type||'cash';
    if(SCHEDULED_TYPES.includes(pt))return false;  // 定期/投資排除
    if(pt==='credit_card'){
      // 信用卡：優先用 settlement_month，沒有則退回 billing_month
      const ref=sm||bm;
      return ref && ref<=month;
    }
    // 現金/轉帳等：settlement_month 空白視為當下已付
    if(!sm)return true;
    return sm<=month;
  });
  const paidTotal=paidRecords.reduce((s,r)=>s+(Number(r.amount)||0),0);

  // 次月預計：settlement_month = 下個月
  const nextRecords=mr.filter(r=>{
    const sm=r.settlement_month||'';
    const bm=r.billing_month||'';
    const pt=r.payment_type||'cash';
    if(SCHEDULED_TYPES.includes(pt))return false;
    const ref=sm||(pt==='credit_card'?bm:'');
    return ref===nmo;
  });
  const nextTotal=nextRecords.reduce((s,r)=>s+(Number(r.amount)||0),0);

  // 遠期預定：scheduled 類型，或 settlement_month > 下個月
  const farRecords=mr.filter(r=>{
    const sm=r.settlement_month||'';
    const bm=r.billing_month||'';
    const pt=r.payment_type||'';
    if(SCHEDULED_TYPES.includes(pt))return true;
    const ref=sm||bm;
    return ref && ref > nmo;
  });

  // 最高單筆（全部本月消費）
  const maxR=mr.reduce((m,r)=>(Number(r.amount)||0)>(Number(m.amount)||0)?r:m,{});

  // 更新卡片
  document.getElementById('s-paid').textContent='$'+Math.round(paidTotal).toLocaleString();
  document.getElementById('s-paid-sub').textContent=`${paidRecords.length} 筆｜settlement_month ≤ 本月`;

  document.getElementById('s-next').textContent=nextTotal>0?'$'+Math.round(nextTotal).toLocaleString():'$0';
  const farNote=farRecords.length>0?`，另有 ${farRecords.length} 筆更遠期`:'';
  document.getElementById('s-next-sub').textContent=`${nextRecords.length} 筆｜${y}年${parseInt(mo)+1>12?1:parseInt(mo)+1}月帳單${farNote}`;

  document.getElementById('s-count').textContent=mr.length;
  document.getElementById('s-month').textContent=`${y}年${parseInt(mo)}月`;
  document.getElementById('s-max').textContent=maxR.amount?'$'+Math.round(Number(maxR.amount)).toLocaleString():'—';
  document.getElementById('s-max-desc').textContent=maxR.merchant||maxR.item||'—';
}

function drawDashboard(){
  drawTrend();
  drawPie();
}

function drawTrend(){
  const canvas=document.getElementById('chart-trend');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||400;
  canvas.height=180;
  const now=new Date();
  const months=[];
  const totals=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');
    const key=`${y}-${m}`;
    months.push(`${d.getMonth()+1}月`);
    const sum=allRecords.filter(r=>parseMonthKey(r)===key).reduce((s,r)=>s+(Number(r.amount)||0),0);
    totals.push(sum);
  }
  const W=canvas.width,H=canvas.height;
  const pad={t:20,r:20,b:30,l:60};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const max=Math.max(...totals,1);
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#e5e5e0';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.t+iH*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+iW,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText('$'+Math.round(max*i/4/1000)+'k',pad.l-6,y+4);
  }
  // line
  const pts=totals.map((v,i)=>({x:pad.l+iW*i/(months.length-1),y:pad.t+iH*(1-v/max)}));
  // fill
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+iH);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,pad.t+iH);ctx.closePath();
  ctx.fillStyle='rgba(24,95,165,0.08)';ctx.fill();
  // line stroke
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#185fa5';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  // dots & labels
  pts.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle='#185fa5';ctx.fill();
    ctx.fillStyle='#444';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(months[i],p.x,H-8);
    if(totals[i]>0){ctx.fillStyle='#185fa5';ctx.fillText('$'+Math.round(totals[i]/1000)+'k',p.x,p.y-10);}
  });
}

function drawPie(){
  const canvas=document.getElementById('chart-pie');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const month=document.getElementById('f-month').value;
  const mr=allRecords.filter(r=>parseMonthKey(r)===month);
  const catMap={};
  mr.forEach(r=>{const c=r.category||'其他';catMap[c]=(catMap[c]||0)+(Number(r.amount)||0);});
  const entries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  const colors=['#185fa5','#1D9E75','#BA7517','#993C1D','#534ab7','#3b6d11','#a32d2d','#5f5e5a','#0f6e56','#854f0b'];
  const W=160,H=160,cx=80,cy=80,r=70;
  ctx.clearRect(0,0,W,H);
  if(total===0){ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();return;}
  let angle=-Math.PI/2;
  entries.forEach(([,v],i)=>{
    const sweep=(v/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+sweep);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    angle+=sweep;
  });
  // center hole
  ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  // legend
  const legend=document.getElementById('pie-legend');
  if(legend){
    legend.innerHTML=entries.slice(0,6).map(([c,v],i)=>`
      <div style="display:flex;align-items:center;gap:6px">
        <span style="width:10px;height:10px;border-radius:50%;background:${colors[i%colors.length]};flex-shrink:0"></span>
        <span>${c}</span>
        <span style="color:#999;margin-left:auto">${Math.round(v/total*100)}%</span>
      </div>`).join('');
  }
}

function changePage(d){const pages=Math.ceil(filtered.length/PER_PAGE);currentPage=Math.max(1,Math.min(pages,currentPage+d));renderTable();}

function openAddModal(){
  editingId=null;
  document.getElementById('modal-label').textContent='新增記帳';
  document.getElementById('e-date').value=new Date().toISOString().slice(0,10);
  ['e-amount','e-merchant','e-item','e-card','e-vendor','e-spending-month','e-billing-month','e-settlement-month','e-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('e-cat').value='餐飲';
  document.getElementById('e-pay').value='cash';
  document.getElementById('e-status').value='';
  document.getElementById('edit-modal').classList.add('open');
}

function openEdit(id){
  const r=allRecords.find(x=>x.record_id===id);if(!r)return;
  editingId=id;
  document.getElementById('modal-label').textContent='編輯記帳';
  document.getElementById('e-date').value=r.date||'';
  document.getElementById('e-amount').value=r.amount||'';
  document.getElementById('e-merchant').value=r.merchant||'';
  document.getElementById('e-item').value=r.item||'';
  const catSel=document.getElementById('e-cat');
  if(r.category&&![...catSel.options].find(o=>(o.value||o.text)===r.category)){
    const opt=document.createElement('option');opt.value=r.category;opt.textContent=r.category;
    catSel.insertBefore(opt,catSel.lastElementChild);
  }
  catSel.value=r.category||'其他';
  const paySel=document.getElementById('e-pay');
  if(r.payment_type&&![...paySel.options].find(o=>o.value===r.payment_type)){
    const opt=document.createElement('option');opt.value=r.payment_type;opt.textContent=r.payment_type;
    paySel.appendChild(opt);
  }
  paySel.value=r.payment_type||'cash';
  document.getElementById('e-card').value=r.card_name||'';
  document.getElementById('e-vendor').value=r.vendor||'';
  document.getElementById('e-spending-month').value=r.spending_month||'';
  document.getElementById('e-billing-month').value=r.billing_month||'';
  document.getElementById('e-settlement-month').value=r.settlement_month||'';
  document.getElementById('e-status').value=r.status||'';
  document.getElementById('e-note').value=r.note||'';
  document.getElementById('edit-modal').classList.add('open');
}

async function saveRecord(){
  const date=document.getElementById('e-date').value;
  const amount=parseFloat(document.getElementById('e-amount').value);
  const merchant=document.getElementById('e-merchant').value.trim();
  const item=document.getElementById('e-item').value.trim();
  if(!date||!amount||(!merchant&&!item)){showToast('請填寫日期、金額，以及商家或品項','err');return;}
  const payload={date,amount,category:document.getElementById('e-cat').value,merchant,item,payment_type:document.getElementById('e-pay').value,card_name:document.getElementById('e-card').value.trim(),vendor:document.getElementById('e-vendor').value.trim(),spending_month:document.getElementById('e-spending-month').value,billing_month:document.getElementById('e-billing-month').value,settlement_month:document.getElementById('e-settlement-month').value,status:document.getElementById('e-status').value,note:document.getElementById('e-note').value.trim()};
  try{
    const r=await fetch(editingId?`${API_BASE}/api/expenses/${editingId}`:`${API_BASE}/api/expenses`,{method:editingId?'PUT':'POST',headers:h(),body:JSON.stringify(payload)});
    if(!r.ok){const e=await r.json();showToast(e.details?.join('、')||e.error||'儲存失敗','err');return;}
    closeModal('edit-modal');await loadData();showToast(editingId?'已儲存修改':'已新增記帳');
  }catch(e){showToast('連線失敗','err');}
}

function confirmDel(id){
  const r=allRecords.find(x=>x.record_id===id);if(!r)return;
  document.getElementById('confirm-msg').textContent=`確定要刪除「${r.merchant||r.item||'這筆'} $${Math.round(r.amount||0).toLocaleString()}」嗎？`;
  document.getElementById('confirm-ok').onclick=()=>doDelete(id);
  document.getElementById('confirm-modal').classList.add('open');
}

async function doDelete(id){
  closeModal('confirm-modal');
  try{
    const r=await fetch(`${API_BASE}/api/expenses/${id}`,{method:'DELETE',headers:h()});
    if(!r.ok){const e=await r.json().catch(()=>({}));showToast(e.error||'刪除失敗','err');return;}
    await loadData();showToast('已刪除（軟刪除，Sheets 仍保留記錄）');
  }catch(e){showToast('連線失敗','err');}
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
function closeBg(e,id){if(e.target.id===id)closeModal(id);}
function showToast(msg,type){
  const t=document.getElementById('toast');
  document.getElementById('toast-icon').className='ti '+(type==='err'?'ti-alert-circle':'ti-circle-check');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
init();
